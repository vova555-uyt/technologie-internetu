<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zadanie z predmetu – Technológie internetu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: "Times New Roman", Times, serif;
    }
    header {
      text-align: center;
      padding: 18px 14px 0;
      font-weight: bold;
      font-size: 16px;
      line-height: 1.55;
    }
    main {
      min-height: 76vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 16px 54px;
    }
    .assignment-title {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.25;
      margin-bottom: 24px;
    }
    .task-name {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 64px;
    }
    .symbol {
      font-family: Arial, sans-serif;
      font-size: 72px;
      line-height: 1;
      font-weight: 400;
      color: #111;
      user-select: none;
    }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 20px;
      background: rgba(255,255,255,.96);
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 18px;
      border-top: 1px solid #eee;
    }
    @media (max-width: 480px) {
      header { font-size: 13px; }
      .assignment-title { font-size: 13px; }
      .task-name { margin-bottom: 48px; }
      .symbol { font-size: 64px; }
    }
  </style>
</head>
<body>
  <header>
    TECHNICKÁ UNIVERZITA V KOŠICIACH<br>
    FAKULTA BANÍCTVA, EKOLÓGIE, RIADENIA A GEOTECHNOLÓGIÍ
  </header>

  <main>
    <div class="assignment-title">
      ZADANIE Z PREDMETU<br>
      Technológie internetu
    </div>
    <div class="task-name">Druhé zadanie</div>
    <div class="symbol" aria-label="Dekoratívny symbol">✦</div>
  </main>

  <footer>Volodymyr Petovka</footer>
</body>
</html>
